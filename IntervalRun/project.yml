# XcodeGen spec — run `xcodegen` in this folder to create IntervalRun.xcodeproj
name: IntervalRun

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  IntervalRun:
    type: application
    platform: watchOS
    sources:
      - Sources
    entitlements:
      path: IntervalRun.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Interval Run
        WKApplication: true
        WKWatchOnly: true
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: Interval Run reads your heart rate, distance and energy to show them during your workout.
        NSHealthUpdateUsageDescription: Interval Run saves your interval runs to the Health and Fitness apps.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IntervalRun
        GENERATE_INFOPLIST_FILE: NO
