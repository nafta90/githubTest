<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1C2B45; --steel:#3E6B8A; --gold:#C98A2C; --sage:#4F7A63; --red:#B4443A;
    --paper:#EEF1ED; --card:#FFFFFF; --line:#D7DCD5; --ink:#1C2B45; --inkmute:#5B6673;
  }
  *{box-sizing:border-box;}
  body,html{margin:0;}
  a{color:var(--steel);} a:hover{color:#2c5170;}
</style>
</helmet>

<div style="width:1280px;height:800px;background:var(--paper);font-family:'IBM Plex Sans',sans-serif;color:var(--ink);display:flex;flex-direction:column;">

  <!-- App bar -->
  <div style="height:64px;flex-shrink:0;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 32px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EEF1ED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1.5"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>
      <div style="font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:#fff;letter-spacing:-0.01em;">JV Feeder Generator</div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:22px;height:22px;border-radius:50%;background:var(--sage);color:#fff;display:flex;align-items:center;justify-content:center;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div style="font-size:13px;color:rgba(255,255,255,0.75);">Upload</div>
      </div>
      <div style="width:28px;height:1px;background:rgba(255,255,255,0.28);"></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:22px;height:22px;border-radius:50%;background:var(--sage);color:#fff;display:flex;align-items:center;justify-content:center;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div style="font-size:13px;color:rgba(255,255,255,0.75);">Map Columns</div>
      </div>
      <div style="width:28px;height:1px;background:rgba(255,255,255,0.28);"></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:22px;height:22px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;">3</div>
        <div style="font-size:13px;color:#fff;font-weight:600;">Download</div>
      </div>
    </div>
  </div>

  <!-- Body -->
  <div style="flex:1;display:flex;align-items:center;justify-content:center;">
    <div style="width:600px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:44px 48px;">

      <div style="width:56px;height:56px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>

      <div style="font-family:'Fraunces',serif;font-weight:600;font-size:26px;color:var(--navy);text-align:center;margin-bottom:10px;letter-spacing:-0.01em;">Your feeder is ready</div>
      <div style="font-size:14.5px;color:var(--inkmute);text-align:center;line-height:1.5;margin-bottom:26px;">
        142 rows mapped into <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:2px 7px;color:var(--ink);">JVFeeder_output.xlsx</span>
      </div>

      <div style="border:1px solid var(--line);border-radius:5px;background:var(--paper);padding:16px 20px;margin-bottom:28px;">
        <div style="display:flex;align-items:flex-start;gap:10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <div>
            <div style="font-size:13px;font-weight:600;color:var(--navy);margin-bottom:3px;">Before you upload to Banner</div>
            <div style="font-size:12.5px;color:var(--inkmute);line-height:1.5;">COA is set to <span style="font-family:'IBM Plex Mono',monospace;">2</span> for every row. If your transactions belong to chart 1, 3, or 9, correct the COA column manually before uploading.</div>
          </div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
        <div style="width:100%;background:var(--navy);color:#fff;font-size:14.5px;font-weight:600;padding:13px 0;border-radius:5px;text-align:center;display:flex;align-items:center;justify-content:center;gap:9px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download Feeder
        </div>
        <div style="font-size:13.5px;color:var(--steel);font-weight:600;">Start Over</div>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
